# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Mouse support
set -g mouse on

# True color and font support.
# tmux-256color (not xterm-256color) advertises italics and correct key
# handling to programs running inside tmux; its terminfo is installed.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB,xterm-256color:RGB,*256col*:RGB"
set -g allow-passthrough on

# Increase scrollback
set -g history-limit 50000

# Faster key repetition
set -s escape-time 0

# Plugins.
# NOTE: TPM is not installed (~/.tmux/plugins/ is empty), so none of these are
# active. Install with:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# then press prefix + I inside tmux. The theme below is written inline and
# needs no plugin, so it works either way.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Save/restore sessions (C-b C-s to save, C-b C-r to restore)

# Show current directory as window name
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'

# Cheat sheet popup (prefix + h)
bind h display-popup -w 52 -h 27 -E "bash /home/antoine/.local/bin/tmux-cheatsheet"

# Vim-tmux-navigator: seamless Ctrl+h/j/k/l between tmux and nvim
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# ── Everforest Dark theme ────────────────────────────────────────────
# Matches the kitty and waybar palettes. Written inline so it needs no plugin.

# The only timer-driven thing on this status line is the clock, at minute
# resolution — polling faster than that just wakes the CPU for nothing.
# Session and window names update on tmux events, not on this interval.
set -g status-interval 60
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#2d353b,fg=#d3c6aa"

# Session name as a green capsule, echoing the waybar clock pill.
set -g status-left-length 32
set -g status-left "#[fg=#232a2e,bg=#a7c080,bold]  #S #[fg=#a7c080,bg=#2d353b,nobold]"

set -g status-right-length 48
set -g status-right "#[fg=#3d484d,bg=#2d353b]#[fg=#9da9a0,bg=#3d484d] 󰥔 %H:%M #[fg=#a7c080,bg=#3d484d]#[fg=#232a2e,bg=#a7c080,bold] #h "

set -g window-status-separator ""
set -g window-status-format "#[fg=#859289,bg=#2d353b]  #I #W  "
set -g window-status-current-format "#[fg=#2d353b,bg=#3d484d]#[fg=#d3c6aa,bg=#3d484d,bold] #I #W #[fg=#3d484d,bg=#2d353b,nobold]"

setw -g window-status-activity-style "fg=#dbbc7f,bg=#2d353b"
setw -g window-status-bell-style     "fg=#e67e80,bg=#2d353b,bold"

# Panes
set -g pane-border-style        "fg=#3d484d"
set -g pane-active-border-style "fg=#a7c080"

# Messages, prompt, copy mode
set -g message-style         "bg=#3d484d,fg=#d3c6aa"
set -g message-command-style "bg=#3d484d,fg=#d3c6aa"
set -g mode-style            "bg=#475258,fg=#d3c6aa"
set -g clock-mode-colour     "#a7c080"

# Session hygiene.
# Both of these are already tmux defaults — pinned explicitly so a future
# change can't silently flip them. They do NOT reap anything on their own;
# the tmux-reaper.timer systemd unit does the actual cleanup of idle
# detached sessions (>6h). See ~/.config/systemd/user/tmux-reaper.*
set -g destroy-unattached off
set -g remain-on-exit off

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
