# NC Night · matched to kitty / tmux / waybar
"$schema" = 'https://starship.rs/config-schema.json'

palette = "ncnight"
add_newline = true
command_timeout = 400

format = """
[╭─](grey)\
[](chrome)$os[](fg:chrome bg:bg2)$directory[](fg:bg2 bg:bg1)$git_branch$git_status[](fg:bg1)\
$fill\
$cmd_duration$nodejs$rust$python$golang$docker_context$jobs$time
[╰─](grey)$character"""

[palettes.ncnight]
bg0    = "#121314"
bg1    = "#1b1c1e"
bg2    = "#26282b"
bg3    = "#303236"
fg     = "#d6d8da"
grey   = "#6b6f73"
red    = "#d0574a"
orange = "#d08350"
yellow = "#d4a35a"
green  = "#9fb88a"
chrome = "#a4a8ac"
accent = "#b8473f"
aqua   = "#a9b4bc"
blue   = "#7f93a8"
purple = "#a08aa8"

[fill]
symbol = " "

[os]
disabled = false
style = "fg:bg0 bg:chrome"
format = "[$symbol ]($style)"
[os.symbols]
Fedora = ""
Linux = ""

[directory]
style = "fg:fg bg:bg2"
read_only = " 󰌾"
read_only_style = "fg:red bg:bg2"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false
home_symbol = "~"
format = "[ $path ]($style)[$read_only]($read_only_style)"

[git_branch]
symbol = ""
style = "fg:aqua bg:bg1"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "fg:yellow bg:bg1"
format = "[($all_status$ahead_behind )]($style)"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
untracked = "?${count}"
staged = "+${count}"
deleted = "✘${count}"
stashed = "≡"

[cmd_duration]
min_time = 2000
style = "fg:yellow"
format = "[ $duration]($style) "

[nodejs]
symbol = ""
style = "fg:green"
format = "[$symbol $version]($style) "

[rust]
symbol = ""
style = "fg:orange"
format = "[$symbol $version]($style) "

[python]
symbol = ""
style = "fg:yellow"
format = "[$symbol $version( \\($virtualenv\\))]($style) "

[golang]
symbol = ""
style = "fg:aqua"
format = "[$symbol $version]($style) "

[docker_context]
symbol = ""
style = "fg:blue"
format = "[$symbol $context]($style) "

[jobs]
symbol = "󰜎"
style = "fg:purple"
format = "[$symbol $number]($style) "

[time]
disabled = false
time_format = "%H:%M"
style = "fg:grey"
format = "[ $time]($style)"

[character]
success_symbol = "[❯](bold accent)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold aqua)"
