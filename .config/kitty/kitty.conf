#
# NC Night · matched to the waybar theme

# ── Font ─────────────────────────────────────────────────────────────
font_family                 JetBrainsMono Nerd Font
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
font_size                   12
# A little extra leading — long terminal sessions read better with it.
modify_font                 cell_height 108%
disable_ligatures           cursor

# ── Window ───────────────────────────────────────────────────────────
remember_window_size        no
initial_window_width        950
initial_window_height       500
hide_window_decorations     yes
window_padding_width        12
confirm_os_window_close     0
window_border_width         1px
active_border_color         #6b6f73
inactive_border_color       #26282b

# Opaque. Transparency forces a per-frame alpha blend; on battery that is a
# measurable cost for an effect sway can't blur anyway. dynamic_background_
# opacity stays on, so ctrl+shift+a then m/l adjusts it live when you want it.
background_opacity          1.0
dynamic_background_opacity  yes

# ── Cursor ───────────────────────────────────────────────────────────
cursor_shape                block
# 0 = never blink. A blinking cursor repaints twice a second for as long as
# the terminal is open — the single largest idle wakeup source in kitty.
cursor_blink_interval       0
# Native replacement for the ml4w cursor-trail include that no longer exists.
# Only animates while the cursor moves, so it costs nothing at idle.
cursor_trail                3
cursor_trail_decay          0.1 0.4
cursor_trail_start_threshold 2

# ── Scrollback & mouse ───────────────────────────────────────────────
scrollback_lines            10000
wheel_scroll_min_lines      1
copy_on_select              yes
mouse_hide_wait             3.0
url_style                   curly
strip_trailing_spaces       smart

# ── Bell ─────────────────────────────────────────────────────────────
enable_audio_bell           no
visual_bell_duration        0.0
bell_on_tab                 "󰂚 "

# ── Performance / power ──────────────────────────────────────────────
# Defaults are 10ms / 3ms, tuned for input latency over efficiency. Raising
# them coalesces redraws into fewer, larger GPU wakeups; the difference is
# imperceptible while typing.
repaint_delay               16
input_delay                 6
sync_to_monitor             yes
wayland_enable_ime          no

# ── Tab bar ──────────────────────────────────────────────────────────
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_bar_min_tabs            2
tab_title_template          "{index}  {title}"
active_tab_foreground       #0a0b0c
active_tab_background       #b8473f
active_tab_font_style       bold
inactive_tab_foreground     #7a7e83
inactive_tab_background     #1b1c1e
inactive_tab_font_style     normal
tab_bar_background          #0a0b0c

# ── NC Night · black paint, chrome, taillight red ─────────────────────────────────────────
background                  #121314
foreground                  #d6d8da
selection_background        #303236
selection_foreground        #d6d8da
cursor                      #b8473f
cursor_text_color           #121314
url_color                   #b8473f

# black
color0                      #1b1c1e
color8                      #55595e
# red
color1                      #d0574a
color9                      #de7b70
# green
color2                      #9fb88a
color10                     #b3c9a0
# yellow (taillight amber)
color3                      #d4a35a
color11                     #e2b871
# blue
color4                      #7f93a8
color12                     #9aaabb
# magenta (muted)
color5                      #a08aa8
color13                     #a88a9e
# cyan (headlight ice)
color6                      #a9b4bc
color14                     #bcc6cc
# white (chrome)
color7                      #d6d8da
color15                     #eceef0

# ── Local overrides ──────────────────────────────────────────────────
# Put machine-specific tweaks in custom.conf; it is included last so it wins.
# (The old ml4w and matugen includes were removed — neither tool is installed
# and both files were missing, so kitty was falling back to default colors.)
include $HOME/.config/kitty/custom.conf
