#
# Everforest Dark · matched to the waybar theme

# ── Font ─────────────────────────────────────────────────────────────
font_family                 JetBrainsMono Nerd Font
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
font_size                   12
# A little extra leading — long terminal sessions read better with it.
modify_font                 cell_height 108%
disable_ligatures           cursor

# ── Window ───────────────────────────────────────────────────────────
remember_window_size        no
initial_window_width        950
initial_window_height       500
hide_window_decorations     yes
window_padding_width        12
confirm_os_window_close     0
window_border_width         1px
active_border_color         #a7c080
inactive_border_color       #3d484d

# Opaque. Transparency forces a per-frame alpha blend; on battery that is a
# measurable cost for an effect sway can't blur anyway. dynamic_background_
# opacity stays on, so ctrl+shift+a then m/l adjusts it live when you want it.
background_opacity          1.0
dynamic_background_opacity  yes

# ── Cursor ───────────────────────────────────────────────────────────
cursor_shape                block
# 0 = never blink. A blinking cursor repaints twice a second for as long as
# the terminal is open — the single largest idle wakeup source in kitty.
cursor_blink_interval       0
# Native replacement for the ml4w cursor-trail include that no longer exists.
# Only animates while the cursor moves, so it costs nothing at idle.
cursor_trail                3
cursor_trail_decay          0.1 0.4
cursor_trail_start_threshold 2

# ── Scrollback & mouse ───────────────────────────────────────────────
scrollback_lines            10000
wheel_scroll_min_lines      1
copy_on_select              yes
mouse_hide_wait             3.0
url_style                   curly
strip_trailing_spaces       smart

# ── Bell ─────────────────────────────────────────────────────────────
enable_audio_bell           no
visual_bell_duration        0.0
bell_on_tab                 "󰂚 "

# ── Performance / power ──────────────────────────────────────────────
# Defaults are 10ms / 3ms, tuned for input latency over efficiency. Raising
# them coalesces redraws into fewer, larger GPU wakeups; the difference is
# imperceptible while typing.
repaint_delay               16
input_delay                 6
sync_to_monitor             yes
wayland_enable_ime          no

# ── Tab bar ──────────────────────────────────────────────────────────
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_bar_min_tabs            2
tab_title_template          "{index}  {title}"
active_tab_foreground       #232a2e
active_tab_background       #a7c080
active_tab_font_style       bold
inactive_tab_foreground     #859289
inactive_tab_background     #343f44
inactive_tab_font_style     normal
tab_bar_background          #232a2e

# ── Everforest Dark (medium) ─────────────────────────────────────────
background                  #2d353b
foreground                  #d3c6aa
selection_background        #475258
selection_foreground        #d3c6aa
cursor                      #d3c6aa
cursor_text_color           #2d353b
url_color                   #a7c080

# black
color0                      #343f44
color8                      #868d80
# red
color1                      #e67e80
color9                      #e67e80
# green
color2                      #a7c080
color10                     #a7c080
# yellow
color3                      #dbbc7f
color11                     #dbbc7f
# blue
color4                      #7fbbb3
color12                     #7fbbb3
# magenta
color5                      #d699b6
color13                     #d699b6
# cyan
color6                      #83c092
color14                     #83c092
# white
color7                      #d3c6aa
color15                     #d3c6aa

# ── Local overrides ──────────────────────────────────────────────────
# Put machine-specific tweaks in custom.conf; it is included last so it wins.
# (The old ml4w and matugen includes were removed — neither tool is installed
# and both files were missing, so kitty was falling back to default colors.)
include $HOME/.config/kitty/custom.conf
